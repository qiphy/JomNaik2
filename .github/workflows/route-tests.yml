
name: JomRide route regression tests

on:
  push:
    branches: [main]
    paths:
      - "jomnaik/lib/**"
      - "jomnaik/test/**"
      - "jomnaik/assets/offline/**"
      - "jomnaik/pubspec.yaml"
      - "jomnaik/pubspec.lock"
      - ".github/workflows/route-tests.yml"

  pull_request:
    paths:
      - "jomnaik/lib/**"
      - "jomnaik/test/**"
      - "jomnaik/assets/offline/**"
      - "jomnaik/pubspec.yaml"
      - "jomnaik/pubspec.lock"
      - ".github/workflows/route-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jomride-route-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-tests:
    name: Flutter route regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: jomnaik

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('jomnaik/pubspec.lock') }}

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run RAPTOR route regression tests
        run: flutter test test/raptor_*_test.dart
